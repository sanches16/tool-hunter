# Isolated test fixture (T008 subset, Iteration D2B): production-mode `app` + PostgreSQL 17 `db`;
# plus the profile-gated silent-listener (Iteration D2C1) and config-fault (Iteration D2C2)
# scenarios, see the sections below.
# Standalone from the developer `compose.yaml`. Used only by tests/integration/health.test.mjs, which
# runs it under a unique `-p` project name per run, generates ephemeral DB/user/password values and
# passes them only through the child-process environment, then removes the project with
# `down -v --remove-orphans --rmi local`. No `.env` file is consumed for these values.

services:
  app:
    build:
      # Repository root (this file lives in tests/); the production Dockerfile and runtime stage.
      context: ..
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
    ports:
      # Loopback only, dynamic host port; discovered with `docker compose port app 3000`.
      - "127.0.0.1::3000"
    depends_on:
      db:
        # Gates initial startup only; DB stop/start never restarts or recreates the app.
        condition: service_healthy
        restart: false
    restart: "no"
    healthcheck:
      # Liveness of the HTTP server only (static page); deliberately independent of the database.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
    # No host port: the database is reachable only on the project-owned Compose network.
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: "no"
    healthcheck:
      # TCP check on 127.0.0.1 so the init-time socket-only server is not reported ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # --- Silent-dependency fault scenario (T007/T010 subset, Iteration D2C1) ------------------------
  # Profile-gated: never started by the default (D2B) selection. The silent-listener suite starts
  # only `stalled-postgres` + `app-stalled` with `--profile silent-listener` in its own project.

  stalled-postgres:
    profiles: [silent-listener]
    # Same pinned Node 24 base image as the production Dockerfile; runs only the mounted fixture.
    image: node:24-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
    user: node
    command: ["node", "/fixture/stalled-postgres.mjs"]
    volumes:
      - ./fixtures/stalled-postgres.mjs:/fixture/stalled-postgres.mjs:ro
    ports:
      # Test-only control endpoint (GET /active), loopback only, dynamic host port. The silent
      # PostgreSQL-like port 5432 is never published; it is reachable only on the project network.
      - "127.0.0.1::8080"
    restart: "no"
    stop_grace_period: 5s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/active').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 2s

  app-stalled:
    profiles: [silent-listener]
    # Same production Dockerfile/runtime stage as `app`; only the database destination differs.
    build:
      context: ..
    environment:
      POSTGRES_HOST: stalled-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1::3000"
    depends_on:
      stalled-postgres:
        condition: service_healthy
        restart: false
    restart: "no"
    healthcheck:
      # HTTP server liveness only (static page); independent of the database.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  # --- Runtime configuration faults (T010 configuration part, Iteration D2C2) --------------------
  # Profile-gated: never started by the default (D2B) or silent-listener selections. The
  # configuration-fault suite builds and recreates only `app-config` with `--profile config-fault`
  # in its own project. No database service and no depends_on: configuration rejection must happen
  # before any connection attempt.
  #
  # The POSTGRES_* variables come ONLY from the per-scenario env file named by
  # CONFIG_FAULT_ENV_FILE (written by the test into an owned temporary directory), so a variable can
  # be truly absent (key omitted) or empty (`KEY=`). They are deliberately not taken from the Compose
  # process environment: the `${...:?}` interpolations above apply to the whole file, so that
  # environment must keep valid values. Default /dev/null = no variables when the profile is unused.

  app-config:
    profiles: [config-fault]
    # Same production Dockerfile/runtime stage as `app`; only the runtime configuration differs.
    build:
      context: ..
    env_file: ${CONFIG_FAULT_ENV_FILE:-/dev/null}
    ports:
      - "127.0.0.1::3000"
    restart: "no"
    healthcheck:
      # HTTP server liveness only (static page); independent of the database.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

volumes:
  # Project-scoped (prefixed with the unique project name) and removed by `down -v`.
  db-data:
